[package]
name = "rabbit_client"
version = "0.1.0"
edition = "2021"
description = "Minimal RabbitChain JSON-RPC client for game clients (Rust, no bevy dependency)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt", "time"] }
