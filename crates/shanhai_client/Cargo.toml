[package]
name = "shanhai_client"
version = "0.1.0"
edition = "2021"
description = "ShanHai RabbitChain-native client skeleton (bevy fork app/ecs/log only, no renderer)"

[dependencies]
bevy_app = { path = "../bevy_app" }
bevy_ecs = { path = "../bevy_ecs" }
bevy_log = { path = "../bevy_log" }
shanhai-core = { path = "../../../shanhai-onchain-mmo/shanhai-core" }
rabbit_client = { path = "../rabbit_client" }
rabbitcore = { path = "../../../Rabbit-Chain-node/crates/rabbitcore" }
ed25519-dalek = "2.1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
chrono = "0.4"
